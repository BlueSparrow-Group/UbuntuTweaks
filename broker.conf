[oidc]
issuer = https://login.microsoftonline.com/<ISSUER_ID>/v2.0
client_id = <CLIENT_ID>
force_provider_authentication = true

[users]
allowed-users = ALL

# First user that logs in has to be a administrator, so that they can manage allowed users 
# in /var/snap/authd-<broker_name>/current/broker.conf